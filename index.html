<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация - Управление складом</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --text-secondary: #666666;
      --border-color: #dcdfe6;
      --input-bg: #ffffff;
      --primary-color: #5b46f6;
      --primary-hover: #4834e0;
      --error-color: #e74c3c;
      --error-bg: #fde8e8;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --text-color: #f1f1f1;
      --text-secondary: #999999;
      --border-color: #33333e;
      --input-bg: #16161a;
      --primary-color: #6c5ce7;
      --primary-hover: #5849e0;
      --error-color: #ff6b6b;
      --error-bg: #3c1e1e;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-controls select, .theme-btn {
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background: var(--primary-color);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .icon-box svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .header h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .tabs {
      display: flex;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--card-bg);
      color: var(--primary-color);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary-color);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .alert-error {
      background-color: var(--error-bg);
      color: var(--error-color);
      border: 1px solid var(--error-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Шапка управления (Язык и Тема) -->
    <div class="top-controls">
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ru" selected>Русский</option>
        <option value="uk">Українська</option>
        <option value="en">English</option>
      </select>
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Тёмная</button>
    </div>

    <!-- Заголовок -->
    <div class="header">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8subscriptionZ"/></svg>
      </div>
      <h2 id="title">Авторизация</h2>
      <p id="subtitle">Управление заявками и персоналом склада</p>
    </div>

    <!-- Переключатель Вход/Регистрация -->
    <div class="tabs">
      <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">Вход</button>
      <button class="tab-btn active" id="tabRegister" onclick="switchTab('register')">Регистрация</button>
    </div>

    <!-- Блок ошибок -->
    <div class="alert alert-error" id="errorBox"></div>

    <!-- Форма -->
    <form id="authForm" onsubmit="handleSubmit(event)">
      
      <!-- Поле Роли -->
      <div class="form-group">
        <label id="lblRole">Роль при регистрации</label>
        <select id="roleSelect" onchange="handleRoleChange()">
          <option value="admin">Администратор</option>
          <option value="manager">Менеджер</option>
        </select>
      </div>

      <!-- Поле Склада (только для Админа) -->
      <div class="form-group" id="warehouseGroup">
        <label id="lblWarehouse">Выберите свой склад *</label>
        <select id="warehouseSelect">
          <option value="" disabled selected>-- Выберите склад --</option>
          <option value="oil">Oil</option>
          <option value="erc">ЕРЦ</option>
          <option value="murmansk">Мурманская</option>
        </select>
      </div>

      <!-- Поле Кода Доступа -->
      <div class="form-group">
        <label id="lblCode">Код доступа (для Менеджера/Админа) *</label>
        <input type="password" id="accessCode" placeholder="•••" required>
      </div>

      <!-- Имя и Фамилия -->
      <div class="row" id="nameRow">
        <div class="form-group">
          <label id="lblLastName">Фамилия *</label>
          <input type="text" id="lastName" placeholder="Иванов">
        </div>
        <div class="form-group">
          <label id="lblFirstName">Имя *</label>
          <input type="text" id="firstName" placeholder="Иван">
        </div>
      </div>

      <!-- Номер телефона -->
      <div class="form-group" id="phoneGroup">
        <label id="lblPhone">Номер телефона *</label>
        <input type="tel" id="phone" placeholder="+380000000000">
      </div>

      <!-- Пароль -->
      <div class="form-group">
        <label id="lblPassword">Пароль *</label>
        <input type="password" id="password" placeholder="•••••" required>
      </div>

      <!-- Кнопка -->
      <button type="submit" class="btn-submit" id="btnSubmit">Зарегистрироваться</button>
    </form>
  </div>

  <script>
    // --- Локализация ---
    const translations = {
      ru: {
        title: "Авторизация",
        subtitle: "Управление заявками и персоналом склада",
        login: "Вход",
        register: "Регистрация",
        role: "Роль при регистрации",
        admin: "Администратор",
        manager: "Менеджер",
        warehouse: "Выберите свой склад *",
        selectWarehouse: "-- Выберите склад --",
        code: "Код доступа (для Менеджера/Админа) *",
        lastName: "Фамилия *",
        firstName: "Имя *",
        phone: "Номер телефона *",
        password: "Пароль *",
        btnRegister: "Зарегистрироваться",
        btnLogin: "Войти",
        errWarehouseRequired: "Пожалуйста, выберите склад!",
        errInvalidCode: "Введен неверный код доступа!",
        themeDark: "🌙 Тёмная",
        themeLight: "☀️ Светлая",
        successReg: "Регистрация успешно пройдена!"
      },
      uk: {
        title: "Авторизація",
        subtitle: "Управління заявками та персоналом складу",
        login: "Вхід",
        register: "Реєстрація",
        role: "Роль при реєстрації",
        admin: "Адміністратор",
        manager: "Менеджер",
        warehouse: "Оберіть свій склад *",
        selectWarehouse: "-- Оберіть склад --",
        code: "Код доступу (для Менеджера/Адміна) *",
        lastName: "Прізвище *",
        firstName: "Ім'я *",
        phone: "Номер телефону *",
        password: "Пароль *",
        btnRegister: "Зареєструватися",
        btnLogin: "Увійти",
        errWarehouseRequired: "Будь ласка, оберіть склад!",
        errInvalidCode: "Введено невірний код доступу!",
        themeDark: "🌙 Темна",
        themeLight: "☀️ Світла",
        successReg: "Реєстрацію успішно пройдено!"
      },
      en: {
        title: "Authorization",
        subtitle: "Warehouse management system",
        login: "Sign In",
        register: "Register",
        role: "Registration Role",
        admin: "Administrator",
        manager: "Manager",
        warehouse: "Select your warehouse *",
        selectWarehouse: "-- Select warehouse --",
        code: "Access Code (Manager/Admin) *",
        lastName: "Last Name *",
        firstName: "First Name *",
        phone: "Phone Number *",
        password: "Password *",
        btnRegister: "Register",
        btnLogin: "Sign In",
        errWarehouseRequired: "Please select a warehouse!",
        errInvalidCode: "Invalid access code!",
        themeDark: "🌙 Dark",
        themeLight: "☀️ Light",
        successReg: "Registration successful!"
      }
    };

    let currentLang = 'ru';
    let currentMode = 'register';

    // --- Валидация кодов доступа ---
    const VALID_CODES = {
      manager: "111",
      admin: {
        oil: "221",
        erc: "222",
        murmansk: "223"
      }
    };

    function handleRoleChange() {
      const role = document.getElementById('roleSelect').value;
      const warehouseGroup = document.getElementById('warehouseGroup');
      const warehouseSelect = document.getElementById('warehouseSelect');
      
      if (role === 'admin') {
        warehouseGroup.style.display = 'block';
        warehouseSelect.required = true;
      } else {
        warehouseGroup.style.display = 'none';
        warehouseSelect.required = false;
        warehouseSelect.value = "";
      }
    }

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      
      const isReg = mode === 'register';
      document.getElementById('nameRow').style.display = isReg ? 'flex' : 'none';
      document.getElementById('phoneGroup').style.display = isReg ? 'block' : 'none';
      
      handleRoleChange();
      
      const lang = translations[currentLang];
      document.getElementById('btnSubmit').innerText = isReg ? lang.btnRegister : lang.btnLogin;
      hideError();
    }

    function handleSubmit(e) {
      e.preventDefault();
      hideError();

      const role = document.getElementById('roleSelect').value;
      const warehouse = document.getElementById('warehouseSelect').value;
      const code = document.getElementById('accessCode').value.trim();
      const lang = translations[currentLang];

      if (currentMode === 'register') {
        // Проверка заполнения склада для админа
        if (role === 'admin' && !warehouse) {
          showError(lang.errWarehouseRequired);
          return;
        }

        // Проверка кодов доступа
        let isValid = false;
        if (role === 'manager' && code === VALID_CODES.manager) {
          isValid = true;
        } else if (role === 'admin' && VALID_CODES.admin[warehouse] === code) {
          isValid = true;
        }

        if (!isValid) {
          showError(lang.errInvalidCode);
          return;
        }
      }

      alert(lang.successReg);
    }

    function showError(msg) {
      const errBox = document.getElementById('errorBox');
      errBox.innerText = msg;
      errBox.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    // --- Переключение языков ---
    function changeLanguage(langKey) {
      currentLang = langKey;
      const lang = translations[langKey];

      document.getElementById('title').innerText = lang.title;
      document.getElementById('subtitle').innerText = lang.subtitle;
      document.getElementById('tabLogin').innerText = lang.login;
      document.getElementById('tabRegister').innerText = lang.register;
      document.getElementById('lblRole').innerText = lang.role;
      document.getElementById('lblWarehouse').innerText = lang.warehouse;
      document.getElementById('warehouseSelect').options[0].text = lang.selectWarehouse;
      document.getElementById('lblCode').innerText = lang.code;
      document.getElementById('lblLastName').innerText = lang.lastName;
      document.getElementById('lblFirstName').innerText = lang.firstName;
      document.getElementById('lblPhone').innerText = lang.phone;
      document.getElementById('lblPassword').innerText = lang.password;
      document.getElementById('btnSubmit').innerText = currentMode === 'register' ? lang.btnRegister : lang.btnLogin;

      const themeBtn = document.getElementById('themeBtn');
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      themeBtn.innerText = isDark ? lang.themeLight : lang.themeDark;
    }

    // --- Переключение темы ---
    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.getElementById('themeBtn');
      const isDark = body.getAttribute('data-theme') === 'dark';
      
      if (isDark) {
        body.removeAttribute('data-theme');
        themeBtn.innerText = translations[currentLang].themeDark;
      } else {
        body.setAttribute('data-theme', 'dark');
        themeBtn.innerText = translations[currentLang].themeLight;
      }
    }

    // Инициализация
    handleRoleChange();
  </script>
</body>
</html>
