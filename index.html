<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Система управления складом</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --text-secondary: #666666;
      --border-color: #dcdfe6;
      --input-bg: #ffffff;
      --primary-color: #5b46f6;
      --primary-hover: #4834e0;
      --error-color: #e74c3c;
      --error-bg: #fde8e8;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --text-color: #f1f1f1;
      --text-secondary: #999999;
      --border-color: #33333e;
      --input-bg: #16161a;
      --primary-color: #6c5ce7;
      --primary-hover: #5849e0;
      --error-color: #ff6b6b;
      --error-bg: #3c1e1e;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-controls select, .theme-btn {
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background: var(--primary-color);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .icon-box svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .header h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .tabs {
      display: flex;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--card-bg);
      color: var(--primary-color);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary-color);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .alert-error {
      background-color: var(--error-bg);
      color: var(--error-color);
      border: 1px solid var(--error-color);
    }

    #dashboardView {
      display: none;
      text-align: center;
    }

    .logout-btn {
      margin-top: 20px;
      background-color: var(--error-color);
    }
  </style>
</head>
<body>

  <!-- ФОРМА АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
  <div class="container" id="authView">
    <div class="top-controls">
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ru">Русский</option>
        <option value="uk" selected>Українська</option>
        <option value="en">English</option>
      </select>
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Темна</button>
    </div>

    <div class="header">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8subscriptionZ"/></svg>
      </div>
      <h2 id="title">Авторизація</h2>
      <p id="subtitle">Управління заявками та персоналом складу</p>
    </div>

    <div class="tabs">
      <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">Вхід</button>
      <button class="tab-btn active" id="tabRegister" onclick="switchTab('register')">Реєстрація</button>
    </div>

    <div class="alert alert-error" id="errorBox"></div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      
      <!-- Выбор роли -->
      <div class="form-group" id="roleGroup">
        <label id="lblRole">Роль</label>
        <select id="roleSelect" onchange="handleRoleChange()">
          <option value="admin">Адміністратор</option>
          <option value="manager">Менеджер</option>
          <option value="outsource">Аутсорс</option>
        </select>
      </div>

      <!-- Выбор склада (для Админа) -->
      <div class="form-group" id="warehouseGroup">
        <label id="lblWarehouse">Оберіть свій склад *</label>
        <select id="warehouseSelect">
          <option value="" disabled selected>-- Оберіть склад --</option>
          <option value="oil">Oil</option>
          <option value="erc">ЕРЦ</option>
          <option value="murmansk">Мурманська</option>
        </select>
      </div>

      <!-- Код доступа (для Админа и Менеджера при регистрации, для Админа при входе) -->
      <div class="form-group" id="codeGroup">
        <label id="lblCode">Код доступу *</label>
        <input type="password" id="accessCode" placeholder="•••">
      </div>

      <!-- Имя и Фамилия (Только регистрация) -->
      <div class="row" id="nameRow">
        <div class="form-group">
          <label id="lblLastName">Прізвище *</label>
          <input type="text" id="lastName" placeholder="Іванов">
        </div>
        <div class="form-group">
          <label id="lblFirstName">Ім'я *</label>
          <input type="text" id="firstName" placeholder="Іван">
        </div>
      </div>

      <!-- Телефон -->
      <div class="form-group" id="phoneGroup">
        <label id="lblPhone">Номер телефону *</label>
        <input type="tel" id="phone" placeholder="+380000000000" required>
      </div>

      <!-- Пароль -->
      <div class="form-group">
        <label id="lblPassword">Пароль *</label>
        <input type="password" id="password" placeholder="•••••" required>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Зареєструватися</button>
    </form>
  </div>

  <!-- ЛИЧНЫЙ КАБИНЕТ (СОХРАНЯЕТСЯ ПРИ ОБНОВЛЕНИИ СТРАНИЦЫ) -->
  <div class="container" id="dashboardView">
    <h2 id="dashWelcome">Вітаємо в системі!</h2>
    <p id="dashRoleText" style="margin-top: 10px; color: var(--text-secondary);"></p>
    <button class="btn-submit logout-btn" onclick="logout()" id="btnLogout">Вийти</button>
  </div>

  <script>
    const translations = {
      ru: {
        title: "Авторизация",
        subtitle: "Управление заявками и персоналом склада",
        login: "Вход",
        register: "Регистрация",
        role: "Роль",
        admin: "Администратор",
        manager: "Менеджер",
        outsource: "Аутсорс",
        warehouse: "Выберите свой склад *",
        selectWarehouse: "-- Выберите склад --",
        code: "Код доступа *",
        lastName: "Фамилия *",
        firstName: "Имя *",
        phone: "Номер телефона *",
        password: "Пароль *",
        btnRegister: "Зарегистрироваться",
        btnLogin: "Войти",
        errWarehouseRequired: "Пожалуйста, выберите склад!",
        errInvalidCode: "Введен неверный код доступа для выбранного склада!",
        themeDark: "🌙 Тёмная",
        themeLight: "☀️ Светлая",
        successReg: "Регистрация успешно пройдена!",
        successLogin: "Успешный вход в систему!",
        dashWelcome: "Добро пожаловать в систему!",
        btnLogout: "Выйти"
      },
      uk: {
        title: "Авторизація",
        subtitle: "Управління заявками та персоналом складу",
        login: "Вхід",
        register: "Реєстрація",
        role: "Роль",
        admin: "Адміністратор",
        manager: "Менеджер",
        outsource: "Аутсорс",
        warehouse: "Оберіть свій склад *",
        selectWarehouse: "-- Оберіть склад --",
        code: "Код доступу *",
        lastName: "Прізвище *",
        firstName: "Ім'я *",
        phone: "Номер телефону *",
        password: "Пароль *",
        btnRegister: "Зареєструватися",
        btnLogin: "Увійти",
        errWarehouseRequired: "Будь ласка, оберіть склад!",
        errInvalidCode: "Введено невірний код доступу для обраного складу!",
        themeDark: "🌙 Темна",
        themeLight: "☀️ Світла",
        successReg: "Реєстрацію успішно пройдено!",
        successLogin: "Успішний вхід у систему!",
        dashWelcome: "Вітаємо в системі!",
        btnLogout: "Вийти"
      },
      en: {
        title: "Authorization",
        subtitle: "Warehouse management system",
        login: "Sign In",
        register: "Register",
        role: "Role",
        admin: "Administrator",
        manager: "Manager",
        outsource: "Outsource",
        warehouse: "Select your warehouse *",
        selectWarehouse: "-- Select warehouse --",
        code: "Access Code *",
        lastName: "Last Name *",
        firstName: "First Name *",
        phone: "Phone Number *",
        password: "Password *",
        btnRegister: "Register",
        btnLogin: "Sign In",
        errWarehouseRequired: "Please select a warehouse!",
        errInvalidCode: "Invalid access code for the selected warehouse!",
        themeDark: "🌙 Dark",
        themeLight: "☀️ Light",
        successReg: "Registration successful!",
        successLogin: "Successfully logged in!",
        dashWelcome: "Welcome to the system!",
        btnLogout: "Log out"
      }
    };

    let currentLang = 'uk';
    let currentMode = 'register';

    // Коды доступа по складам
    const VALID_CODES = {
      manager: "111",
      admin: {
        oil: "221",
        erc: "222",
        murmansk: "223"
      }
    };

    // Переключение отображения полей
    function handleRoleChange() {
      const role = document.getElementById('roleSelect').value;
      const warehouseGroup = document.getElementById('warehouseGroup');
      const warehouseSelect = document.getElementById('warehouseSelect');
      const codeGroup = document.getElementById('codeGroup');
      const accessCode = document.getElementById('accessCode');

      if (currentMode === 'register') {
        if (role === 'admin') {
          warehouseGroup.style.display = 'block';
          codeGroup.style.display = 'block';
          warehouseSelect.required = true;
          accessCode.required = true;
        } else if (role === 'manager') {
          warehouseGroup.style.display = 'none';
          codeGroup.style.display = 'block';
          warehouseSelect.required = false;
          warehouseSelect.value = "";
          accessCode.required = true;
        } else {
          // Аутсорс
          warehouseGroup.style.display = 'none';
          codeGroup.style.display = 'none';
          warehouseSelect.required = false;
          accessCode.required = false;
        }
      } else {
        // Режим Входа
        if (role === 'admin') {
          // Админ на входе ОБЯЗАТЕЛЬНО выбирает склад и вводит код доступа
          warehouseGroup.style.display = 'block';
          codeGroup.style.display = 'block';
          warehouseSelect.required = true;
          accessCode.required = true;
        } else {
          // Менеджер и Аутсорс входят только по телефону и паролю
          warehouseGroup.style.display = 'none';
          codeGroup.style.display = 'none';
          warehouseSelect.required = false;
          accessCode.required = false;
        }
      }
    }

    // Переключение вкладок Вход / Регистрация
    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      
      const isReg = mode === 'register';
      document.getElementById('nameRow').style.display = isReg ? 'flex' : 'none';
      
      handleRoleChange();
      
      const lang = translations[currentLang];
      document.getElementById('btnSubmit').innerText = isReg ? lang.btnRegister : lang.btnLogin;
      hideError();
    }

    // Валидация формы при отправке
    function handleSubmit(e) {
      e.preventDefault();
      hideError();

      const role = document.getElementById('roleSelect').value;
      const warehouse = document.getElementById('warehouseSelect').value;
      const code = document.getElementById('accessCode').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const lang = translations[currentLang];

      if (currentMode === 'register') {
        // РЕГИСТРАЦИЯ
        if (role === 'admin') {
          if (!warehouse) {
            showError(lang.errWarehouseRequired);
            return;
          }
          if (VALID_CODES.admin[warehouse] !== code) {
            showError(lang.errInvalidCode);
            return;
          }
        } else if (role === 'manager') {
          if (code !== VALID_CODES.manager) {
            showError(lang.errInvalidCode);
            return;
          }
        }

        alert(lang.successReg);
        saveSession(phone, role, warehouse);

      } else {
        // ВХОД
        if (role === 'admin') {
          // Проверка склада и кода для админа при входе!
          if (!warehouse) {
            showError(lang.errWarehouseRequired);
            return;
          }
          if (VALID_CODES.admin[warehouse] !== code) {
            showError(lang.errInvalidCode);
            return;
          }
        }

        alert(lang.successLogin);
        saveSession(phone, role, warehouse);
      }
    }

    // Сохранение авторизации в браузер
    function saveSession(phone, role, warehouse) {
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userPhone', phone);
      localStorage.setItem('userRole', role);
      localStorage.setItem('userWarehouse', warehouse || '');
      checkSession();
    }

    // Проверка сессии при открытии/обновлении страницы
    function checkSession() {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const authView = document.getElementById('authView');
      const dashboardView = document.getElementById('dashboardView');

      if (isLoggedIn) {
        authView.style.display = 'none';
        dashboardView.style.display = 'block';
        const role = localStorage.getItem('userRole') || '';
        const warehouse = localStorage.getItem('userWarehouse') || '';
        const warehouseText = warehouse ? ` [Склад: ${warehouse.toUpperCase()}]` : '';
        
        document.getElementById('dashRoleText').innerText = `Сесія активна: ${role.toUpperCase()}${warehouseText}`;
      } else {
        authView.style.display = 'block';
        dashboardView.style.display = 'none';
      }
    }

    // Выход из системы
    function logout() {
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('userPhone');
      localStorage.removeItem('userRole');
      localStorage.removeItem('userWarehouse');
      checkSession();
    }

    function showError(msg) {
      const errBox = document.getElementById('errorBox');
      errBox.innerText = msg;
      errBox.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    // Языковой менеджер
    function changeLanguage(langKey) {
      currentLang = langKey;
      const lang = translations[langKey];

      document.getElementById('title').innerText = lang.title;
      document.getElementById('subtitle').innerText = lang.subtitle;
      document.getElementById('tabLogin').innerText = lang.login;
      document.getElementById('tabRegister').innerText = lang.register;
      document.getElementById('lblRole').innerText = lang.role;
      
      const roleSelect = document.getElementById('roleSelect');
      roleSelect.options[0].text = lang.admin;
      roleSelect.options[1].text = lang.manager;
      roleSelect.options[2].text = lang.outsource;

      document.getElementById('lblWarehouse').innerText = lang.warehouse;
      document.getElementById('warehouseSelect').options[0].text = lang.selectWarehouse;
      document.getElementById('lblCode').innerText = lang.code;
      document.getElementById('lblLastName').innerText = lang.lastName;
      document.getElementById('lblFirstName').innerText = lang.firstName;
      document.getElementById('lblPhone').innerText = lang.phone;
      document.getElementById('lblPassword').innerText = lang.password;
      document.getElementById('btnSubmit').innerText = currentMode === 'register' ? lang.btnRegister : lang.btnLogin;
      document.getElementById('dashWelcome').innerText = lang.dashWelcome;
      document.getElementById('btnLogout').innerText = lang.btnLogout;

      const themeBtn = document.getElementById('themeBtn');
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      themeBtn.innerText = isDark ? lang.themeLight : lang.themeDark;
    }

    // Переключение темы
    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.getElementById('themeBtn');
      const isDark = body.getAttribute('data-theme') === 'dark';
      
      if (isDark) {
        body.removeAttribute('data-theme');
        themeBtn.innerText = translations[currentLang].themeDark;
      } else {
        body.setAttribute('data-theme', 'dark');
        themeBtn.innerText = translations[currentLang].themeLight;
      }
    }

    // Запуск
    checkSession();
    changeLanguage('uk');
    handleRoleChange();
  </script>
</body>
</html>
