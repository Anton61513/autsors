<title>АУТСОРС PRO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{background:var(--bg);color:var(--text);transition:.2s}
body.dark{--bg:#0b0f17;--panel:#111827;--panel2:#172033;--text:#f3f4f6;--muted:#9ca3af;--border:#273244;--soft:#182132;--accent:#7067ff}
body:not(.dark){--bg:linear-gradient(135deg,#eef3ff,#f8f2ff);--panel:#fff;--panel2:#f6f8fb;--text:#172033;--muted:#717b8d;--border:#e1e5ec;--soft:#f3f5f9;--accent:#625cf4}
button,input,select{font:inherit}.hidden{display:none!important}
.header{height:70px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px}.logo{font-weight:900;font-size:22px}.logo span{color:var(--accent)}
.wrap{max-width:1050px;margin:auto;padding:28px 16px}.hero{text-align:center;margin:20px auto 28px}.hero h1{font-size:40px;margin:0 0 8px}.hero p{color:var(--muted)}
.auth{max-width:440px;margin:auto;background:var(--panel);padding:26px;border-radius:24px;box-shadow:0 15px 45px #303a6b18}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:20px}.tabs button{border:0;background:transparent;color:var(--text);padding:11px;border-radius:9px;font-weight:800;cursor:pointer}.tabs .active{background:var(--panel);box-shadow:0 2px 8px #0001}

.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,select{width:100%;padding:13px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--text);outline:none}input:focus,select:focus{border-color:var(--accent)}

</head>

</div>

t with this phone number was found.',loginAdmin:'Administrator login requires the access code.',created:'Account created.',logged:'You are logged in.',launched:'Request launched.',removed:'Participation cancelled.',saved:'Rating saved.',full:'Outsourcer request is full!',workerStats:'People statistics',noRatings:'No ratings yet.',adminNoComment:'No comment is required for administrators.',rateWarehouse:'Rate warehouse'}}
let lang=localStorage.getItem(LANGKEY)||'ru',theme=localStorage.getItem(THEMEKEY)||'light';
let db=loadDB(),selectedRole='outsourcer',currentTab='home';
function loadDB(){try{let x=JSON.parse(localStorage.getItem(DBKEY));if(x&&Array.isArray(x.users)&&Array.isArray(x.requests)){x.ratings=x.ratings||[];x.session=sessionStorage.getItem('outsors_session')?Number(sessionStorage.getItem('outsors_session')):null;return x}}catch(e){}return{users:[],requests:[],ratings:[],session:null}}
function save(){const session=db.session;const shared={users:db.users,requests:db.requests,ratings:db.ratings};localStorage.setItem(DBKEY,JSON.stringify(shared));if(session!=null)sessionStorage.setItem('outsors_session',String(session));else sessionStorage.removeItem('outsors_session')}

function $(id){return document.getElementById(id)} function tr(k){return(T[lang]||T.ru)[k]||k}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uid(){return Date.now()+Math.floor(Math.random()*1000)} function user(){return db.users.find(u=>u.id===db.session)||null}

function buildNav(){const u=user();let buttons=u.role==='admin'?[['admin','adminPanel'],['mine','myRequests'],['ratings','ratings'],['warehouseRatings','warehouseRatings'],['profile','profile']]:[['home','allRequests'],['mine','myRequests'],['warehouseRatings','warehouseRatings'],['profile','profile']];$('nav').innerHTML='';buttons.forEach(([id,key])=>{const b=document.createElement('button');b.type='button';b.textContent=tr(key);b.className=currentTab===id?'active':'';b.onclick=()=>{currentTab=id;buildNav();render()};$('nav').appendChild(b)})}
function render(){const u=user();if(!u)return;$('accountInfo').textContent=u.first+' '+u.last+' · '+(u.role==='admin'?tr('adminType').toUpperCase():tr('outType').toUpperCase());applySettings();if(currentTab==='home')renderHome();else if(currentTab==='mine')renderMine();else if(currentTab==='profile')renderProfile();else if(currentTab==='admin')renderAdmin();else if(currentTab==='ratings')renderOutRatings();else if(currentTab==='warehouseRatings')renderWarehouseRatings();else if(currentTab==='settings')renderSettings()}
function reqHTML(r,adminView){const u=user(),full=r.people.length>=r.count,joined=r.people.some(p=>p.userId===u.id),people=r.people.map((p,i)=>'<div>'+(i+1)+'. '+esc(p.name)+'</div>').join('');let h='<div class="request"><div class="row"><span class="badge">'+(full?tr('filled'):tr('open'))+'</span><b>'+r.people.length+'/'+r.count+'</b></div><h3>'+tr('warehouse')+' — '+esc(r.warehouse)+'</h3><div class="row"><span>📅 '+esc(r.date)+'</span><span>🕐 '+esc(r.from)+'–'+esc(r.to)+'</span></div><div class="row"><span>💰 <b>'+esc(r.pay)+' грн/час</b></span><span>👷 '+r.count+' '+tr('people')+'</span></div>';if(people)h+='<div class="people"><b>'+tr('workers')+'</b>'+people+'</div>';if(!adminView&&u.role==='outsourcer'&&!full&&!joined)h+='<button class="primary full joinBtn" data-id="'+r.id+'">'+tr('accept')+'</button>';if(!adminView&&u.role==='outsourcer'&&joined)h+='<button class="danger full leaveBtn" data-id="'+r.id+'">'+tr('cancel')+'</button>';h+='</div>';return h}
function bindCommon(){document.querySelectorAll('.joinBtn').forEach(b=>b.onclick=()=>join(Number(b.dataset.id)));document.querySelectorAll('.leaveBtn').forEach(b=>b.onclick=()=>leave(Number(b.dataset.id)));document.querySelectorAll('.rateBtn').forEach(b=>b.onclick=()=>ratePrompt(b.dataset.kind,Number(b.dataset.target),b.dataset.request?Number(b.dataset.request):null))}
function renderHome(){const active=db.requests.filter(r=>!r.closed);$('view').innerHTML='<div class="card"><h1>📋 '+tr('available')+'</h1>'+(active.length?active.map(r=>reqHTML(r,false)).join(''):'<p class="muted">'+tr('noActive')+'</p>')+'</div>';bindCommon()}
function renderMine(){const u=user();let arr;if(u.role==='admin'){arr=db.requests.filter(r=>Number(r.creator)===Number(u.id));}else{arr=db.requests.filter(r=>Array.isArray(r.people)&&r.people.some(p=>Number(p.userId)===Number(u.id)&&p.active!==false));}arr.sort((a,b)=>(Number(b.id)||0)-(Number(a.id)||0));let body=arr.length?arr.map(r=>{let card=reqHTML(r,u.role==='admin');if(u.role==='outsourcer'){card=card.replace('<h3>'+tr('warehouse')+' — ', '<div class="takenNotice">✅ '+tr('takenNotice')+'</div><h3>'+tr('warehouse')+' — ');}return card;}).join(''):'<p class="muted">'+tr('noRequests')+'</p>';$('view').innerHTML='<div class="card"><h1>'+tr('history')+'</h1>'+body+'</div>';bindCommon()}
function renderProfile(){const u=user(),ratings=db.ratings.filter(r=>r.kind==='outsourcer'&&r.targetId===u.id),given=db.ratings.filter(r=>r.authorId===u.id);$('view').innerHTML='<div class="card"><h1>'+tr('profileTitle')+'</h1><div class="stats"><div><div class="num">'+esc(u.first)+'</div><small>'+tr('first')+'</small></div><div><div class="num">'+esc(u.last)+'</div><small>'+tr('last')+'</small></div><div><div class="num" style="font-size:16px">'+esc(u.phone)+'</div><small>'+tr('phone')+'</small></div></div><p><b>'+tr('type')+':</b> '+(u.role==='admin'?tr('adminType'):tr('outType'))+'</p><h2>'+tr('myStats')+'</h2><div class="stats"><div><div class="num">'+db.requests.filter(r=>r.people.some(p=>p.userId===u.id)).length+'</div><small>'+tr('accepted')+'</small></div><div><div class="num">'+(ratings.length?avg(ratings.map(r=>r.stars)):'—')+' ⭐</div><small>'+tr('avgGiven')+'</small></div><div><div class="num">'+ratings.length+'</div><small>'+tr('received')+'</small></div></div></div>'}
function renderAdmin(){const u=user();let form='<div class="card"><h1>'+tr('adminCreate')+'</h1><div class="field"><label>'+tr('warehouse')+'</label><select id="aWarehouse"><option>Ткань</option><option>Склад №2</option><option>Склад №3</option><option>Склад №4</option></select></div><div class="row"><div style="width:50%"><div class="field"><label>'+tr('date')+'</label><input id="aDate" type="date"></div></div><div style="width:50%"><div class="field"><label>'+tr('count')+'</label><input id="aCount" type="number" min="1" value="6"></div></div></div><div class="row"><div style="width:50%"><div class="field"><label>'+tr('from')+'</label><input id="aFrom" type="time" value="08:00"></div></div><div style="width:50%"><div class="field"><label>'+tr('to')+'</label><input id="aTo" type="time" value="17:00"></div></div></div><div class="field"><label>'+tr('pay')+', грн</label><input id="aPay" type="number" min="1" value="90"></div><button id="launchBtn" class="primary full">'+tr('launch')+'</button></div>';$('view').innerHTML=form; $('launchBtn').onclick=createRequest}
function createRequest(){const r={id:uid(),warehouse:$('aWarehouse').value,date:$('aDate').value||new Date().toISOString().slice(0,10),from:$('aFrom').value,to:$('aTo').value,pay:Number($('aPay').value)||90,count:Math.max(1,Number($('aCount').value)||1),people:[],closed:false,creator:user().id};db.requests.unshift(r);save();toast(tr('launched'));currentTab='mine';buildNav();render()}
function join(id){const u=user(),r=db.requests.find(x=>x.id===id);if(!r||r.closed||r.people.some(p=>p.userId===u.id)||r.people.length>=r.count)return;r.people.push({userId:u.id,name:u.first+' '+u.last,phone:u.phone,active:true,acceptedAt:Date.now()});if(r.people.length>=r.count)r.closed=true;save();renderHome();if(r.closed)toast(tr('full'))}
function leave(id){const r=db.requests.find(x=>x.id===id);if(!r)return;r.people=r.people.filter(p=>p.userId!==user().id);r.closed=false;save();renderMine()}
function starsHTML(value,id){let h='<div class="rating" data-rating="'+id+'">';for(let i=1;i<=5;i++)h+='<button type="button" class="star '+(i<=value?'on':'')+'" data-star="'+i+'">★</button>';return h+'</div>'}
function ratePrompt(kind,targetId,requestId){const existing=db.ratings.find(r=>r.kind===kind&&r.targetId===targetId&&r.authorId===user().id&&(!requestId||r.requestId===requestId));if(existing)return toast(tr('rated'));const title=kind==='warehouse'?tr('ratingWh'):tr('ratingOut');let wrap=document.createElement('div');wrap.innerHTML='<div class="ratingbox"><b>'+title+'</b>'+starsHTML(0,'temp')+'<div class="comment hidden"><textarea id="ratingComment" style="width:100%;min-height:90px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text)" placeholder="'+tr('commentPlaceholder')+'"></textarea></div><button class="primary full" id="saveRating">'+tr('save')+'</button></div>';const host=document.createElement('div');host.appendChild(wrap.firstElementChild);document.body.appendChild(host.firstChild);const box=document.body.lastElementChild;let selected=0;box.querySelectorAll('.star').forEach(s=>s.onclick=()=>{selected=Number(s.dataset.star);box.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',Number(x.dataset.star)<=selected));box.querySelector('.comment').classList.toggle('hidden',kind==='warehouse'?selected<=3:false)});box.querySelector('#saveRating').onclick=()=>{if(!selected){alert('★');return}if(kind==='warehouse'&&selected<=3){const c=box.querySelector('#ratingComment').value.trim();if(!c){alert(tr('commentRequired'));return}}db.ratings.push({id:uid(),kind,targetId,requestId,authorId:user().id,stars:selected,comment:kind==='warehouse'&&selected<=3?box.querySelector('#ratingComment').value.trim():''});save();box.remove();toast(tr('saved'));render()};box.scrollIntoView({behavior:'smooth'})}
function renderOutRatings(){const people=db.users.filter(x=>x.role==='outsourcer');let h='<div class="card"><h1>⭐ '+tr('workerStats')+'</h1><p class="muted">'+tr('ratingOut')+'</p>';people.forEach(p=>{const rs=db.ratings.filter(r=>r.kind==='outsourcer'&&r.targetId===p.id);h+='<div class="person"><div class="ratingrow"><div><b>'+esc(p.first+' '+p.last)+'</b><div class="mini">'+esc(p.phone)+'</div></div><div class="avg">'+avg(rs.map(r=>r.stars))+' ⭐</div></div><div class="mini">'+rs.length+' '+tr('received')+'</div><button class="primary ratePersonBtn" data-id="'+p.id+'">'+tr('rate')+'</button>'+(rs.length?rs.slice(-3).map(r=>'<div class="mini" style="margin-top:6px">'+('★'.repeat(r.stars))+' · '+esc(r.comment||'—')+'</div>').join(''):'<p class="muted">'+tr('noRatings')+'</p>')+'</div>'});$('view').innerHTML=h+'</div>';document.querySelectorAll('.ratePersonBtn').forEach(b=>b.onclick=()=>rateOut(Number(b.dataset.id)))}
function rateOut(targetId){const box=document.createElement('div');box.className='card';box.innerHTML='<h3>'+tr('ratingOut')+'</h3>'+starsHTML(0,'out')+'<button class="primary full" id="saveOut">'+tr('save')+'</button>';document.body.appendChild(box);let selected=0;box.querySelectorAll('.star').forEach(s=>s.onclick=()=>{selected=+s.dataset.star;box.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',+x.dataset.star<=selected))});box.querySelector('#saveOut').onclick=()=>{if(!selected)return;db.ratings.push({id:uid(),kind:'outsourcer',targetId,authorId:user().id,stars:selected,comment:''});save();box.remove();toast(tr('saved'));renderOutRatings()};box.scrollIntoView({behavior:'smooth'})}
function renderWarehouseRatings(){const warehouses=[...new Set(db.requests.map(r=>r.warehouse))];let h='<div class="card"><h1>🏭 '+tr('warehouseRatings')+'</h1>';warehouses.forEach(w=>{const rs=db.ratings.filter(r=>r.kind==='warehouse'&&r.targetName===w),my=db.ratings.find(r=>r.kind==='warehouse'&&r.targetName===w&&r.authorId===user().id);h+='<div class="person"><div class="ratingrow"><b>'+esc(w)+'</b><div class="avg">'+avg(rs.map(r=>r.stars))+' ⭐</div></div><div class="mini">'+rs.length+' '+tr('received')+'</div>';if(user().role==='outsourcer'&&!my)h+='<button class="primary rateBtn" data-kind="warehouse" data-target="0" data-request="0" data-name="'+esc(w)+'">'+tr('rate')+'</button>';h+='</div>'});if(user().role==='outsourcer'){h=h.replace(/data-target="0"/g,'data-target="0"');} $('view').innerHTML=h+'</div>';document.querySelectorAll('.rateBtn').forEach(b=>b.onclick=()=>{const w=b.dataset.name;const fakeId=0;const old=db.ratings.find(r=>r.kind==='warehouse'&&r.targetName===w&&r.authorId===user().id);if(old)return;const title=tr('ratingWh');let box=document.createElement('div');box.className='card';box.innerHTML='<h3>'+title+' — '+esc(w)+'</h3>'+starsHTML(0,'wh')+'<div class="comment hidden"><textarea id="ratingComment" style="width:100%;min-height:90px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text)" placeholder="'+tr('commentPlaceholder')+'"></textarea></div><button class="primary full" id="saveW">'+tr('save')+'</button>';document.body.appendChild(box);let selected=0;box.querySelectorAll('.star').forEach(s=>s.onclick=()=>{selected=+s.dataset.star;box.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',+x.dataset.star<=selected));box.querySelector('.comment').classList.toggle('hidden',selected>=4)});box.querySelector('#saveW').onclick=()=>{if(!selected)return;if(selected<=3&&!box.querySelector('#ratingComment').value.trim()){alert(tr('commentRequired'));return}db.ratings.push({id:uid(),kind:'warehouse',targetName:w,authorId:user().id,stars:selected,comment:selected<=3?box.querySelector('#ratingComment').value.trim():''});save();box.remove();toast(tr('saved'));renderWarehouseRatings()};box.scrollIntoView({behavior:'smooth'})})}
function renderSettings(){$('view').innerHTML='<div class="card"><h1>'+tr('settings')+'</h1><div class="settings"><div><label><b>'+tr('language')+'</b></label><select id="langSel"><option value="ru">Русский</option><option value="uk">Українська</option><option value="en">English</option></select></div><div><label><b>'+tr('theme')+'</b></label><select id="themeSel"><option value="light">'+tr('light')+'</option><option value="dark">'+tr('dark')+'</option></select></div></div></div>';$('langSel').value=lang;$('themeSel').value=theme;$('langSel').onchange=e=>{lang=e.target.value;localStorage.setItem(LANGKEY,lang);buildNav();render()};$('themeSel').onchange=e=>{theme=e.target.value;localStorage.setItem(THEMEKEY,theme);applySettings()}}
window.addEventListener('storage',e=>{if(e.key===DBKEY){refreshShared();if(db.session&&user())render()}});applySettings();if(db.session&&user())openApp();else authMode('register');
})();
</script>
</body>
</html>
